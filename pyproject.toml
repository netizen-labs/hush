[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hush-scan"
version = "0.1.0"
description = "Zero-dependency, git-aware secret scanner. Keep your keys hushed."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lucas Gabriel Ramos Aguiar" }]
keywords = [
    "security",
    "secrets",
    "scanner",
    "credentials",
    "pre-commit",
    "git",
    "devsecops",
    "entropy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# No runtime dependencies. That is the whole point.
dependencies = []

[project.urls]
Homepage = "https://github.com/lucasgabriel/hush"
Repository = "https://github.com/lucasgabriel/hush"
Issues = "https://github.com/lucasgabriel/hush/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
hush = "hush.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hush"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["hush"]
branch = true
